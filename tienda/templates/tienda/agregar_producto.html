{% extends 'tienda/base.html' %}
{% load static %}

{% block extra_css %}
    <style>
        .fondo-pantalla-completa {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)), 
                        url('{% static "img/baner.jpeg" %}') no-repeat center center fixed;
            background-size: cover;
            min-height: calc(100vh - 70px); 
            display: flex;
            align-items: center;
            justify-content: center;
            /* Quitamos el margen negativo y dejamos padding generoso arriba y abajo */
            padding: 4rem 1rem; 
            margin: 0; 
        }

        .add-card {
            background-color: rgba(33, 37, 41, 0.85);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            width: 100%;
            max-width: 600px;
            padding: 2.5rem;
            /* Margen extra para asegurar la separación con el navbar */
            margin-top: 2rem;
            margin-bottom: 2rem;
        }

        .add-card label {
            color: #ffc107; 
            font-weight: 600;
            margin-bottom: 0.3rem;
            margin-top: 1rem;
            font-size: 0.95rem;
        }
        
        .helptext {
            font-size: 0.8rem;
            color: #ced4da;
            display: block;
            margin-top: 0.3rem;
            font-style: italic;
        }
        
        .add-card input::placeholder, .edit-card input::placeholder {
            color: rgba(255, 255, 255, 0.6) !important;
        }
    </style>
{% endblock %}

{% block content %}
   
    <!-- Este div es el que ahora tiene la imagen de fondo de baúl y centra todo -->
    <div class="fondo-pantalla-completa">
        
        <!-- Esta es tu tarjeta oscura -->
        <div class="add-card shadow-lg">
            
            <div class="text-center mb-4">
                <h2 class="text-warning fw-bold">➕ Subir Nueva Polera</h2>
                <p class="text-light opacity-75 small">Completa los datos para añadirla al catálogo</p>
            </div>
            
            <!-- AQUI VA TU ETIQUETA <form> EXACTAMENTE COMO LA TENÍAS -->
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                
                {{ form.as_p }}
                
                <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top border-secondary border-opacity-50">
                    <a href="{% url 'catalogo' %}" class="text-light opacity-75 text-decoration-none small">
                        ← Volver al catálogo
                    </a>
                    <button type="submit" class="btn btn-warning fw-bold px-4 rounded-pill">
                        Subir Polera
                    </button>
                </div>
            </form>
            
        </div>
        
    </div>

{% endblock %}
