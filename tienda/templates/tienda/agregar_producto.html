<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Subir Polera - Store Poleras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <div class="container py-5" style="max-width: 600px;">
        <div class="card bg-secondary text-light p-4 shadow-lg border-0">
            <h2 class="mb-4 text-warning fw-bold text-center">👕 Subir Nueva Polera</h2>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'catalogo' %}" class="btn btn-outline-light">Cancelar</a>
                    <button type="submit" class="btn btn-success fw-bold px-4">Guardar Polera</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
