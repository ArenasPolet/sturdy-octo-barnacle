{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cotizar Diseño Personalizado - Store Poleras</title>
    <link rel="icon" type="image/png" href="{% static 'img/pelota.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Fondo a pantalla completa */
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)), 
                        url('{% static "img/baner.jpeg" %}') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
        }

        /* Tarjeta flotante con efecto de vidrio */
        .custom-card {
            background-color: rgba(33, 37, 41, 0.85);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            width: 100%;
            max-width: 600px;
            padding: 2.5rem;
        }

        /* Etiquetas de los campos en amarillo para mantener la identidad de tu marca */
        .custom-card label {
            color: #ffc107; 
            font-weight: 600;
            margin-bottom: 0.3rem;
            margin-top: 1rem;
            font-size: 0.95rem;
        }
        
        .helptext {
            font-size: 0.8rem;
            color: #adb5bd;
            display: block;
            margin-top: 0.3rem;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="custom-card shadow-lg text-light text-center">
        <h2 class="mb-3 text-warning fw-bold">Cotiza tu polera</h2>
        <p class="text-light opacity-75 mb-4">Sube la imagen de la polera que quieres y cuéntanos los detalles. Te redirigiremos a WhatsApp para cotizarla.</p>
        
        <form method="post" enctype="multipart/form-data" class="text-start">
            {% csrf_token %}
            {{ form.as_p }}
            
            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center mt-5">
                <a href="{% url 'catalogo' %}" class="text-light text-decoration-none opacity-75 small hover-warning mb-3 mb-sm-0">
                    ← Volver al catálogo
                </a>
                <!-- El botón sigue siendo verde (success) para asociarlo mentalmente con WhatsApp -->
                <button type="submit" class="btn btn-success fw-bold px-4 rounded-pill shadow">
                    Cotizar por WhatsApp 📲
                </button>
            </div>
        </form>
    </div>

</body>
</html>
