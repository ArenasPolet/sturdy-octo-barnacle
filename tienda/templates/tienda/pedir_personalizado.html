{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cotizar Diseño Personalizado</title>
    <link rel="icon" type="image/png" href="{% static 'img/logo.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <!-- Navbar simple para volver atrás -->
    <nav class="navbar navbar-dark bg-black border-bottom border-secondary p-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-uppercase" href="{% url 'catalogo' %}">← Volver a la Tienda</a>
        </div>
    </nav>

    <div class="container py-5" style="max-width: 600px;">
        <div class="card bg-secondary text-light p-5 shadow-lg rounded-4 border-0 text-center">
            <h2 class="mb-3 text-warning fw-bold">🎨 Tu Propio Diseño</h2>
            <p class="text-light opacity-75 mb-4">Sube la imagen que quieres en tu polera y cuéntanos los detalles (talla, color de polera). Te redirigiremos a WhatsApp para cotizarla.</p>
            
            <form method="post" enctype="multipart/form-data" class="text-start">
                {% csrf_token %}
                {{ form.as_p }}
                
                <button type="submit" class="btn btn-success w-100 fw-bold py-3 mt-3 rounded-pill shadow">
                    Enviar y Cotizar por WhatsApp 📲
                </button>
            </form>
        </div>
    </div>
</body>
</html>
