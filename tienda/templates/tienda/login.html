<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Store Poleras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center vh-100">
    <div class="card bg-secondary text-light p-4 shadow-lg border-0" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4 fw-bold text-warning">🔑 Admin Login</h3>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-warning w-100 fw-bold mt-3">Entrar</button>
        </form>
        <div class="text-center mt-3">
            <a href="{% url 'catalogo' %}" class="text-decoration-none text-light small">← Volver al catálogo</a>
        </div>
    </div>
</body>
</html>
