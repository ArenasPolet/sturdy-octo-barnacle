{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Polera - Store Poleras</title>
    <link rel="icon" type="image/png" href="{% static 'img/pelota.jpg' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Estilos para el fondo a pantalla completa */
        body {
            /* Usamos un gradiente un poco más oscuro para que los campos del formulario resalten bien */
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)), 
                        url('{% static "img/baner.jpeg" %}') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh; /* min-height en vez de height por si el formulario es largo y hay que hacer scroll */
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem; /* Espacio arriba y abajo para que no choque con los bordes en celulares */
        }

        /* Estilos para la cajita flotante (Glassmorphism) */
        .edit-card {
            background-color: rgba(33, 37, 41, 0.85);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            width: 100%;
            max-width: 600px; /* Es un poco más ancha que el login porque tiene más campos */
            padding: 2.5rem;
        }

        /* Estilizamos las etiquetas (títulos) de los campos que genera Django */
        .edit-card label {
            color: #0dcaf0; /* Color cyan (info) para que combine con el botón */
            font-weight: 600;
            margin-bottom: 0.3rem;
            margin-top: 1rem;
            font-size: 0.95rem;
        }
        
        /* Estilos para los textos de ayuda (ej. el texto de cómo escribir las tallas) */
        .helptext {
            font-size: 0.8rem;
            color: #ced4da;
            display: block;
            margin-top: 0.3rem;
            font-style: italic;
        }
          /* Y para asegurarnos de que el "Stock por Talla:" (que es un label) sea amarillo como los demás: */
        .add-card label, .edit-card label {
            color: #ffc107 !important; /* Fuerza el amarillo */
            font-weight: 600;
            margin-bottom: 0.3rem;
            margin-top: 1rem;
            font-size: 0.95rem;
            display: inline-block;
        }
        /* Fuerza a que el texto de ejemplo (placeholder) sea blanco transparente */
        .add-card input::placeholder, .edit-card input::placeholder {
            color: rgba(255, 255, 255, 0.6) !important;
        }
    </style>
</head>
<body>

    <div class="edit-card shadow-lg text-light">
        <div class="text-center mb-4">
            <h2 class="text-info fw-bold mb-1">✏️ Editar Polera</h2>
            <p class="text-light opacity-75">{{ producto.nombre }}</p>
        </div>
        
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            
            <div class="d-flex justify-content-between align-items-center mt-5">
                <a href="{% url 'catalogo' %}" class="text-light text-decoration-none opacity-75 small hover-warning">
                    ← Cancelar
                </a>
                <button type="submit" class="btn btn-info fw-bold px-4 text-dark rounded-pill shadow">
                    Guardar Cambios
                </button>
            </div>
        </form>
    </div>

</body>
</html>
