{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Polera - Store Poleras</title>
    <link rel="icon" type="image/png" href="{% static 'img/logo.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <div class="container py-5" style="max-width: 600px;">
        <div class="card bg-secondary text-light p-4 shadow-lg border-0">
            <h2 class="mb-4 text-info fw-bold text-center">✏️ Editar: {{ producto.nombre }}</h2>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'catalogo' %}" class="btn btn-outline-light">Cancelar</a>
                    <button type="submit" class="btn btn-info fw-bold px-4 text-dark">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
